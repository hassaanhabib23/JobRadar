# Traefik terminates TLS and sets X-Forwarded-Proto on the request it makes to
# this container, but that hop is over plain HTTP — nginx's own $scheme is
# always "http" here. Forward Traefik's header when present; only fall back to
# $scheme for a direct connection (e.g. `docker compose up` with no proxy in
# front), so Django's SECURE_SSL_REDIRECT doesn't loop believing every request
# arrived over HTTP.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend and API are same-origin, so the refresh cookie works without any
    # CORS configuration.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Runtime config must never be cached, or a redeploy keeps serving the old
    # API base URL.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routes must not 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
