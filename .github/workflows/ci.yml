name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest

    services:
      # Real Postgres, never SQLite: the schema relies on jsonb, GIN indexes,
      # full-text search and partial indexes, none of which SQLite has.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobradar
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-key
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov --cov-report=term-missing

      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Not a secret — a throwaway long enough to satisfy security.W009,
          # so the check exercises the real hardening rather than tripping on itself.
          DJANGO_SECRET_KEY: ci-only-4d8f2a9b7c1e6035af94db21e7c85f30a6b4d9e2c7108f3a5b6d
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
