# JobRadar — default stack. `docker compose up` should be the entire setup (NFR1).
# Worker and beat services arrive in milestone 6 with the run lifecycle.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # web/worker wait on this, so first boot can't fail with a confusing
      # "connection refused" while Postgres is still starting.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobradar} -d ${POSTGRES_DB:-jobradar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
    # One image for all three backend processes. Building it three times under
    # three names wastes disk and lets them drift: rebuilding `web` alone leaves
    # the worker running last week's code, which is invisible until a task fails
    # for a reason that makes no sense.
    image: jobradar-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Three backend processes, not one. Deploying only `web` is the single most
  # common way this silently stops working: the API keeps serving yesterday's
  # data while nothing is fetching or scheduling.
  worker:
    image: jobradar-backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, not CMD: the exec form runs no shell, so `$$HOSTNAME` reaches
      # celery as a literal string and it hunts for a node by that name forever.
      # No destination is needed anyway — there is one worker, and asking it to
      # identify itself by hostname only adds a way to be wrong.
      #
      # This matters more than a normal healthcheck: a worker that dies takes
      # the daily run with it and nothing else notices. A check that is
      # permanently red is worse than none, because it teaches you to ignore it.
      test: ["CMD-SHELL", "celery -A config inspect ping | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    image: jobradar-backend
    restart: unless-stopped
    # Fires the daily schedule. If this dies, nothing ever starts — and you
    # would not notice, which is why the dashboard shows the last-run age.
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Written into /config.json by the entrypoint, so one image runs anywhere.
      API_BASE_URL: ${API_BASE_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
